version: "3.9"

services:
  checkycheck:
    build:
      context: .
      dockerfile: Dockerfile
    image: checkycheck:dos
    container_name: checkycheck_dos
    environment:
      TZ: Europe/Amsterdam
      CHECKYCHECK_CONFIG_PATH: /config
      cc_passphrase: ${cc_passphrase}
    expose:
      - "8070"
    restart: unless-stopped
    volumes:
      - checkycheck-dos-data:/data
      - ${CHECKYCHECK_CONFIG_SOURCE:-/opt/checkycheck/config}:/config:ro
      - ${CHECKYCHECK_SECRETS_DIR:-/opt/checkycheck/secrets}:/run/secrets/checkycheck:ro
    networks:
      - traefik_web

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: checkycheck_dos_oauth2_proxy
    restart: unless-stopped
    depends_on:
      - checkycheck
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://checkycheck:8070/
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OAUTH2_PROXY_WHITELIST_DOMAINS}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_web
      - traefik.http.routers.checkycheck-dos.rule=Host(`${CHECKYCHECK_HOST}`)
      - traefik.http.routers.checkycheck-dos.entrypoints=websecure
      - traefik.http.routers.checkycheck-dos.tls=true
      - traefik.http.routers.checkycheck-dos.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.checkycheck-dos.service=checkycheck-dos
      - traefik.http.services.checkycheck-dos.loadbalancer.server.port=4180
    networks:
      - traefik_web

networks:
  traefik_web:
    external: true

volumes:
  checkycheck-dos-data:
