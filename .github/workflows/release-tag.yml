name: Release from Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          OUTDIR="dist"

          LINUX_ARTIFACT_DIR="${OUTDIR}/checkycheck-${TAG}-linux-amd64"
          mkdir -p "${LINUX_ARTIFACT_DIR}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-X main.AppVersion=${VERSION}" -o "${LINUX_ARTIFACT_DIR}/checkycheck" .
          tar -C "${OUTDIR}" -czf "${OUTDIR}/checkycheck-${TAG}-linux-amd64.tar.gz" "checkycheck-${TAG}-linux-amd64"

          WINDOWS_ARTIFACT_DIR="${OUTDIR}/checkycheck-${TAG}-windows-amd64"
          mkdir -p "${WINDOWS_ARTIFACT_DIR}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="-X main.AppVersion=${VERSION}" -o "${WINDOWS_ARTIFACT_DIR}/checkycheck.exe" .
          (cd "${OUTDIR}" && zip -r "checkycheck-${TAG}-windows-amd64.zip" "checkycheck-${TAG}-windows-amd64")

          sha256sum "${OUTDIR}/checkycheck-${TAG}-linux-amd64.tar.gz" "${OUTDIR}/checkycheck-${TAG}-windows-amd64.zip" > "${OUTDIR}/checksums.txt"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ inputs.tag || github.ref_name }}
          tags: |
            ghcr.io/sal-consultancy/checky-check:${{ inputs.tag || github.ref_name }}
            ghcr.io/sal-consultancy/checky-check:beta

      - name: Create GitHub prerelease when needed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-beta.') }}
          generate_release_notes: true
          files: |
            dist/checkycheck-*.tar.gz
            dist/checkycheck-*.zip
            dist/checksums.txt
