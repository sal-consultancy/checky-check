name: Release from Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build Linux binary
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          OUTDIR="dist"
          ARTIFACT_DIR="${OUTDIR}/checkycheck-${TAG}-linux-amd64"
          mkdir -p "${ARTIFACT_DIR}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-X main.AppVersion=${VERSION}" -o "${ARTIFACT_DIR}/checkycheck" .
          tar -C "${OUTDIR}" -czf "${OUTDIR}/checkycheck-${TAG}-linux-amd64.tar.gz" "checkycheck-${TAG}-linux-amd64"
          sha256sum "${OUTDIR}/checkycheck-${TAG}-linux-amd64.tar.gz" > "${OUTDIR}/checksums.txt"

      - name: Create GitHub prerelease when needed
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
          files: |
            dist/checkycheck-*.tar.gz
            dist/checksums.txt
