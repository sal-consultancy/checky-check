checks:
  check_uptime:
    title: Uptime
    description: Controleer de uptime van de host
    command: "uptime | awk '{print $3}'"
    fail_when: ">"
    fail_value: "90"

  linux_version:
    title: "Linux version"
    description: "Geeft de huidige Linux versie weer die op de server draait."
    command: awk -F= '/^NAME/ {name=$2} /^VERSION/ {version=$2} END {gsub(/"/, "", name); gsub(/"/, "", version); print name, version}' /etc/os-release
    graph:
      title: Aantal hosts per linux versie
      type: bar
    fail_when: "not in"
    fail_value: ${allowed_linux_versions}
    output_valid_for: 60
    vars:
      allowed_linux_versions: [ 'CentOS Stream 9' ]

  linux_kernel_version:
    title: "Linux kernel version"
    description: "Geeft de huidige Linux kernel versie weer die op de server draait."
    command: "uname -r"
    graph:
      title: Aantal hosts per linux kernel versie
      type: bar
    fail_when: "not in"
    fail_value: ${allowed_linux_kernel_versions}
    output_valid_for: 60
    vars:
      allowed_linux_kernel_versions: [ '5.14.0-378.el9.x86_64' ]

  check_disk_root_usage:
    title: Root Filesystem Usage
    description: Controleer of het root-filesystem niet te vol loopt
    command: "df -P / | awk 'NR==2 {gsub(/%/, \"\", $5); print $5}'"
    fail_when: ">"
    fail_value: "80"
    graph:
      title: Root filesystem usage by 10% range
      type: bar_grouped_by_10_percentile
    sparkline:
      enabled: true
      points: 14

  check_failed_systemd_units:
    title: Failed Systemd Units
    description: Controleer of er geen gefaalde systemd-units aanwezig zijn
    command: "systemctl --failed --no-legend --no-pager 2>/dev/null | wc -l | awk '{print $1}'"
    fail_when: ">"
    fail_value: "0"

  check_reboot_required:
    title: Reboot Required
    description: Controleer of de host een reboot nodig heeft na updates
    command: needs-restarting -r 1>/dev/null ; echo $?
    fail_when: ">"
    fail_value: 0

  check_time_sync:
    title: Time Synchronization
    description: Controleer of NTP of timesync actief en gesynchroniseerd is
    command: |
      if command -v timedatectl >/dev/null 2>&1; then
        if [ "$(timedatectl show -p NTPSynchronized --value 2>/dev/null)" = "yes" ]; then
          echo OK
        else
          echo NOK
        fi
      elif systemctl is-active chronyd >/dev/null 2>&1 || systemctl is-active systemd-timesyncd >/dev/null 2>&1 || systemctl is-active ntpd >/dev/null 2>&1; then
        echo OK
      else
        echo NOK
      fi
    fail_when: "!="
    fail_value: OK

  check_failed_ssh_auth_24h:
    title: Failed SSH Auth Attempts Last 24h
    description: Tel het aantal mislukte of invalid SSH-authenticatiepogingen in de afgelopen 24 uur
    command: |
      journal_output="$(sudo -n journalctl -q -u sshd --since "24 hours ago" --no-pager 2>&1)"
      journal_status=$?

      if [ "$journal_status" -ne 0 ] || printf '%s\n' "$journal_output" | grep -qi 'No journal files were opened\|not seeing messages\|sudo:'; then
        echo "$(( ${security.failed_ssh_auth_24h_max} + 1 ))"
      else
        printf '%s\n' "$journal_output" \
          | grep -Eic 'Failed password|Invalid user|authentication failure|Connection closed by authenticating user|Unable to negotiate' || true
      fi
    fail_when: ">"
    fail_value: ${security.failed_ssh_auth_24h_max}
    graph:
      title: Failed SSH auth attempts per host in the last 24 hours
      type: bar
    sparkline:
      enabled: true
      points: 14
    vars:
      security:
        failed_ssh_auth_24h_max: "100"

  check_required_mounts:
    title: Required Mounts
    description: Controleer of alle verwachte mountpoints aanwezig zijn
    command: |
      missing_mounts=""
      for required_mount in ${mounts.required}; do
        if ! mountpoint -q "$required_mount"; then
          missing_mounts="$missing_mounts $required_mount"
        fi
      done

      if [ -z "$missing_mounts" ]; then
        echo OK
      else
        echo "NOK:$missing_mounts"
      fi
    fail_when: "!="
    fail_value: OK
    vars:
      mounts:
        required: /usr/sap

  check_firewalld:
    title: Firewalld
    description: Controleer of firewalld actief is
    service: firewalld
    fail_when: "="
    fail_value: "0"

  check_firewalld_allowed_ports:
    title: Firewalld Allowed Ports
    description: Controleer of firewalld alleen de opgegeven externe poorten toelaat in de gekozen zone
    command: |
      firewall_output="$(sudo -n firewall-cmd --zone="${firewall.zone}" --list-ports 2>&1)"
      firewall_status=$?

      if [ "$firewall_status" -ne 0 ] || printf '%s\n' "$firewall_output" | grep -qi 'sudo:\|not running\|not found'; then
        echo NOK:FIREWALL_UNAVAILABLE
      else
        actual_ports="$(printf '%s\n' "$firewall_output" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ' | sed 's/ $//')"
        expected_ports="$(printf '%s\n' "${firewall.allowed_ports}" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ' | sed 's/ $//')"

        if [ "$actual_ports" = "$expected_ports" ]; then
          echo OK
        elif [ -z "$actual_ports" ]; then
          echo NOK:NONE
        else
          echo "NOK:$actual_ports"
        fi
      fi
    fail_when: "!="
    fail_value: OK
    graph:
      title: Firewalld allowed ports per host
      type: bar
    vars:
      firewall:
        zone: public
        allowed_ports: "22/tcp 443/tcp"

  check_fail2ban:
    title: Fail2ban
    description: Controleer of fail2ban actief is
    service: fail2ban
    fail_when: "!="
    fail_value: active

  check_fail2ban_banned_ips:
    title: Fail2ban Banned IPs
    description: Tel het totaal aantal gebande IP-adressen over alle actieve fail2ban jails
    command: |
      jail_list_output="$(sudo -n fail2ban-client status 2>&1)"
      jail_list_status=$?

      if [ "$jail_list_status" -ne 0 ] || printf '%s\n' "$jail_list_output" | grep -qi 'sudo:\|not found\|not running'; then
        echo "$(( ${security.fail2ban_banned_ip_max} + 1 ))"
      else
        jail_names="$(printf '%s\n' "$jail_list_output" | awk -F':' '/Jail list:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); gsub(/, */, " ", $2); print $2}')"
        total_banned=0

        if [ -n "$jail_names" ]; then
          for jail_name in $jail_names; do
            jail_status_output="$(sudo -n fail2ban-client status "$jail_name" 2>/dev/null)"
            banned_count="$(printf '%s\n' "$jail_status_output" | awk -F':' '/Currently banned:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}')"
            if [ -n "$banned_count" ]; then
              total_banned=$(( total_banned + banned_count ))
            fi
          done
        fi

        echo "$total_banned"
      fi
    fail_when: ">"
    fail_value: ${security.fail2ban_banned_ip_max}
    graph:
      title: Totaal aantal gebande IP-adressen per host
      type: bar
    sparkline:
      enabled: true
      points: 14
    vars:
      security:
        fail2ban_banned_ip_max: "25"
